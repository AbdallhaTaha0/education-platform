<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>FAYQ · M8 design preview</title>
    <style>
      :root {
        --bg: #0b140e;
        --surface: #14271a;
        --raised: #1d3323;
        --ink: #f8f7ee;
        --muted: #b7c2b0;
        --border: #39523d;
        --brand: #c9f24d;
        --strong: #c9f24d;
        --amber: #f7b500;
        --onbrand: #0f1f12;
        color-scheme: dark;
      }
      [data-theme='light'] {
        --bg: #f5f3e8;
        --surface: #fffef9;
        --raised: #e8eed3;
        --ink: #0f1f12;
        --muted: #4f5c50;
        --border: #c0cbb8;
        --strong: #365314;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-block: 100px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.75 'Noto Sans Arabic',
          'Segoe UI',
          Tahoma,
          sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--strong);
        outline-offset: 5px;
      }
      button {
        color: inherit;
      }
      button:disabled {
        cursor: default;
      }
      svg.icon {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2,
      h3 {
        line-height: 1.35;
      }
      h1 {
        font-size: clamp(34px, 4.2vw, 60px);
        letter-spacing: -0.02em;
      }
      h2 {
        font-size: clamp(24px, 3vw, 36px);
      }
      h3 {
        font-size: 21px;
      }
      .wrap {
        max-width: 1180px;
        margin: auto;
        padding-inline: 28px;
      }
      .demo {
        padding: 5px 20px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      header {
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 10;
        border-bottom: 1px solid var(--border);
      }
      .head {
        min-height: 86px;
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .logo {
        width: 132px;
        height: auto;
        display: block;
      }
      .wordmark-light {
        display: none;
      }
      [data-theme='light'] .wordmark-light {
        display: block;
      }
      [data-theme='light'] .wordmark-dark {
        display: none;
      }
      .topnav {
        display: flex;
        gap: 24px;
        margin-inline: auto;
      }
      .topnav button {
        min-width: 44px;
        border: 0;
        background: none;
        padding: 12px 0;
        color: var(--muted);
        font-weight: 700;
      }
      .topnav button[aria-current='page'] {
        color: var(--strong);
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tool {
        min-width: 44px;
        min-height: 44px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        font-size: 14px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        padding: 10px 24px;
        border-radius: 16px;
        border: 1px solid var(--border);
        font-weight: 800;
        background: var(--surface);
        gap: 10px;
      }
      .primary {
        background: var(--brand);
        color: var(--onbrand);
        border-color: var(--brand);
      }
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        font-size: 13px;
        font-weight: 800;
        color: var(--strong);
        letter-spacing: 0.04em;
      }
      .hero {
        isolation: isolate;
        position: relative;
        min-height: 630px;
        display: flex;
        align-items: center;
        overflow: hidden;
        border-radius: 0 0 38px 38px;
        background: #07150d;
        color: #f8f7ee;
      }
      .hero:before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -2;
        background: url('assets/fayq-learning-hero.png') center/cover no-repeat;
      }
      .hero:after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(
          90deg,
          rgba(5, 17, 10, 0.96),
          rgba(5, 17, 10, 0.7) 38%,
          transparent 75%
        );
      }
      .hero .wrap {
        width: 100%;
      }
      .hero-copy {
        width: 51%;
        margin-right: auto;
        direction: rtl;
        padding-block: 60px;
      }
      .hero-copy[dir='ltr'] {
        direction: ltr;
      }
      .hero .eyebrow {
        color: #c9f24d;
      }
      .hero h1 {
        margin: 20px 0;
        max-width: 10em;
      }
      .hero h1 em {
        font-style: normal;
        color: #c9f24d;
        position: relative;
      }
      .hero p {
        max-width: 44ch;
        color: #dae3d4;
        font-size: 18px;
      }
      .hero .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 28px;
      }
      .hero .secondary {
        color: #f8f7ee;
        background: #12241a;
        border-color: #62775e;
      }
      .hero .slogan {
        color: #f7b500;
        font-weight: 800;
        margin-top: 28px;
        font-size: 15px;
      }
      .stamp {
        display: inline-flex;
        border: 1px solid #718252;
        border-radius: 999px;
        padding: 6px 14px;
        gap: 10px;
        font-size: 13px;
        color: #d9e6c9;
      }
      .section {
        padding-block: 68px;
      }
      .section-title {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 28px;
      }
      .section-title p {
        margin-top: 12px;
        max-width: 64ch;
      }
      .value-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        border-block: 1px solid var(--border);
        background: var(--border);
      }
      .value-strip article {
        background: var(--surface);
        padding: 24px 28px;
        display: flex;
        gap: 16px;
      }
      .value-strip svg {
        color: var(--strong);
        flex-shrink: 0;
        margin-top: 3px;
      }
      .value-strip h3 {
        font-size: 17px;
      }
      .value-strip p {
        font-size: 14px;
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }
      .course {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 22px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .art {
        height: 168px;
        background: #1b3923;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        color: #c9f24d;
      }
      .art:before {
        content: '';
        position: absolute;
        inset: 24px;
        border: 1px solid #718252;
        border-radius: 14px;
        transform: rotate(-7deg);
      }
      .art b {
        font: 800 42px/1 monospace;
        z-index: 1;
      }
      .art.web {
        background: #263326;
        color: #f7b500;
      }
      .art.ai {
        background: #223022;
        color: #f8f7ee;
      }
      .course .body {
        padding: 24px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .tag {
        color: var(--strong);
        font-size: 12px;
        font-weight: 800;
        margin-bottom: 10px;
      }
      .course p {
        color: var(--muted);
        font-size: 14px;
        margin-top: 12px;
      }
      .course .outcome {
        border-top: 1px solid var(--border);
        margin-top: 20px;
        padding-top: 14px;
      }
      .course .price {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-block: 20px;
        font-size: 15px;
      }
      .course .pill {
        width: 100%;
        margin-top: auto;
      }
      .path {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 40px;
        display: grid;
        grid-template-columns: 1fr 1.3fr;
        gap: 40px;
      }
      .steps {
        display: grid;
        gap: 18px;
      }
      .step {
        display: flex;
        gap: 16px;
      }
      .number {
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        width: 42px;
        height: 42px;
        border-radius: 13px;
        flex-shrink: 0;
        color: var(--strong);
        font-weight: 800;
      }
      .step p {
        color: var(--muted);
        font-size: 14px;
      }
      .build {
        margin-top: 26px;
        padding: 26px;
        border-inline-start: 3px solid var(--strong);
        background: var(--raised);
        border-radius: 14px;
      }
      .build strong {
        display: block;
        font-size: 19px;
      }
      .faq {
        max-width: 790px;
        margin: auto;
      }
      details {
        padding: 20px 0;
        border-bottom: 1px solid var(--border);
      }
      summary {
        cursor: pointer;
        font-weight: 700;
      }
      details p {
        margin-top: 14px;
        color: var(--muted);
      }
      footer {
        border-top: 1px solid var(--border);
        padding-block: 36px;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: center;
        font-size: 13px;
        color: var(--muted);
      }
      .page {
        padding-block: 48px;
        min-height: 65vh;
      }
      .page h1 {
        font-size: 36px;
      }
      .search {
        margin-block: 24px;
        width: 100%;
        min-height: 54px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 12px 18px;
        color: var(--ink);
      }
      .panel {
        margin-top: 26px;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 24px;
        padding: 30px;
      }
      .resume {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
        align-items: center;
      }
      .meter {
        height: 9px;
        background: var(--raised);
        border-radius: 8px;
        margin-block: 24px;
      }
      .meter span {
        display: block;
        background: var(--brand);
        width: 35%;
        height: 100%;
        border-radius: inherit;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-block: 30px;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 26px;
        border-radius: 20px;
      }
      .stat b {
        font-size: 30px;
        color: var(--strong);
        display: block;
      }
      .list {
        display: grid;
        gap: 12px;
      }
      .list .row {
        padding: 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .mobile-dock {
        display: none;
      }
      .toast {
        position: fixed;
        inset-inline: 24px;
        bottom: 110px;
        background: var(--surface);
        border: 1px solid var(--strong);
        padding: 18px;
        border-radius: 16px;
        z-index: 40;
        max-width: 550px;
        margin: auto;
      }
      .skip {
        position: fixed;
        top: -100px;
        z-index: 100;
      }
      .skip:focus {
        top: 10px;
        background: var(--brand);
        color: var(--onbrand);
        padding: 14px;
      }
      .focus-message {
        margin-block: 16px;
        color: var(--strong);
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 760px) {
        body {
          padding-bottom: calc(108px + env(safe-area-inset-bottom));
        }
        .wrap {
          padding-inline: 20px;
        }
        .head {
          min-height: 72px;
          gap: 12px;
        }
        .logo {
          width: 106px;
        }
        .topnav {
          display: none;
        }
        .tools {
          margin-inline-start: auto;
          gap: 6px;
        }
        .tool {
          font-size: 12px;
          padding: 4px 8px;
        }
        .hero {
          min-height: 750px;
          align-items: start;
          border-radius: 0 0 26px 26px;
        }
        .hero:before {
          background-position: 70% bottom;
          background-size: auto 460px;
          background-repeat: no-repeat;
        }
        .hero:after {
          background: linear-gradient(
            180deg,
            #07150d 0%,
            #07150d 37%,
            rgba(5, 17, 10, 0.7) 52%,
            transparent 78%
          );
        }
        .hero-copy {
          width: 100%;
          padding-block: 34px 340px;
        }
        .hero h1 {
          font-size: 39px;
          max-width: 10em;
          margin: 18px 0;
        }
        .hero p {
          font-size: 16px;
        }
        .hero .actions {
          margin-top: 22px;
        }
        .hero .slogan {
          margin-top: 18px;
        }
        .value-strip {
          grid-template-columns: 1fr;
        }
        .value-strip article {
          padding: 18px 20px;
        }
        .section {
          padding-block: 44px;
        }
        .section-title {
          align-items: start;
          gap: 12px;
        }
        .section-title .pill {
          padding: 6px 12px;
          font-size: 12px;
          min-height: 44px;
          flex-shrink: 0;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .art {
          height: 155px;
        }
        .course .body {
          padding: 22px;
        }
        .path {
          padding: 24px;
          grid-template-columns: 1fr;
          gap: 28px;
        }
        .resume {
          grid-template-columns: 1fr;
        }
        .stats {
          grid-template-columns: 1fr;
          gap: 12px;
        }
        .stat {
          padding: 20px;
        }
        .stat b {
          font-size: 26px;
        }
        .foot {
          align-items: start;
          flex-direction: column;
        }
        .mobile-dock {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          position: fixed;
          inset-inline: 12px;
          bottom: calc(10px + env(safe-area-inset-bottom));
          border-radius: 24px;
          background: var(--surface);
          border: 1px solid var(--border);
          box-shadow: 0 8px 32px #0005;
          z-index: 20;
          min-height: 76px;
          padding: 6px;
          gap: 2px;
        }
        .mobile-dock button {
          min-height: 62px;
          border: 0;
          background: none;
          border-radius: 18px;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          gap: 3px;
          font-size: 10px;
          font-weight: 700;
          color: var(--muted);
        }
        .mobile-dock .icon-holder {
          border-radius: 50%;
          width: 34px;
          height: 34px;
          display: grid;
          place-items: center;
          transition: transform 0.16s;
        }
        .mobile-dock button[aria-current='page'] {
          color: var(--strong);
          background: var(--raised);
        }
        .mobile-dock button[aria-current='page'] .icon-holder {
          background: var(--brand);
          color: var(--onbrand);
          transform: translateY(-9px);
          box-shadow: 0 0 0 5px var(--surface);
        }
        .mobile-dock button[aria-current='page'] span:last-child {
          transform: translateY(-3px);
        }
        .list .row {
          flex-wrap: wrap;
        }
        .page h1 {
          font-size: 30px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <a href="#content" class="skip">Skip to content</a>
    <div class="demo" id="demo-label"></div>
    <header>
      <div class="wrap head">
        <a href="#home" aria-label="FAYQ" onclick="go('home');return false"
          ><img class="logo wordmark-dark" src="assets/fayq-wordmark-concept.svg" alt="FAYQ" /><svg
            class="logo wordmark-light"
            viewBox="0 0 262 86"
            aria-label="FAYQ"
            role="img"
          >
            <g fill="#0f1f12">
              <path d="M0 76V27L12 13H68L58 29H20V40H56L46 55H20V76Z" />
              <path
                fill-rule="evenodd"
                d="M59 76 87 13H111L135 76H114L108 61H84L78 76ZM91 46H103L97 30Z"
              />
              <path d="M115 13H137L152 36 171 13H194L162 56 159 76H138L142 55Z" />
            </g>
            <path d="M235 57a25 25 0 1 0-13 13" fill="none" stroke="#365314" stroke-width="16" />
            <path d="M211 43 250 76H228L200 49Z" fill="#365314" />
            <path
              d="m203 11-2-4m17 1 1-5m13 14 4-4"
              stroke="#8a5700"
              stroke-width="5"
              stroke-linecap="round"
            /></svg
        ></a>
        <nav class="topnav" aria-label="Main" id="top-nav"></nav>
        <div class="tools">
          <button class="tool" id="role" onclick="toggleRole()"></button
          ><button class="tool" id="language" onclick="toggleLang()"></button
          ><button class="tool" id="theme" aria-label="Change theme" onclick="toggleTheme()">
            ☀
          </button>
        </div>
      </div>
    </header>
    <main id="content" tabindex="-1"></main>
    <footer>
      <div class="wrap foot">
        <span dir="ltr">FAYQ · Learn It. Code It. Get It.</span><span id="foot-note"></span>
      </div>
    </footer>
    <nav class="mobile-dock" aria-label="Mobile navigation" id="bottom-nav"></nav>
    <div class="toast" role="status" id="toast" hidden></div>
    <script>
      let lang = 'ar',
        page = 'home',
        role = 'student',
        timer;
      const pick = (ar, en) => (lang === 'ar' ? ar : en);
      const icons = {
        home: '<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>',
        courses: '<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',
        learning: '<path d="m3 8 9-5 9 5-9 5Z"/><path d="M6 10v7c4 3 8 3 12 0v-7"/>',
        profile: '<circle cx="12" cy="7" r="4"/><path d="M4 21c0-10 16-10 16 0"/>',
        admin: '<path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/>',
      };
      const escapeText = (value) =>
        String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
      const icon = (name) =>
        `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name] || icons.admin}</svg>`;
      const courses = [
        {
          symbol: 'Py',
          art: '',
          ar: 'بايثون: من أول سطر لأول مشروع',
          en: 'Python: your first line to your first project',
          descAr: 'افهم المتغيرات والشروط والحلقات، وابنِ لعبة أسئلة بسيطة.',
          descEn: 'Understand variables, conditions and loops. Build a small quiz game.',
          resultAr: 'مشروعك: لعبة أسئلة',
          resultEn: 'Your project: a quiz game',
          price: 600,
          days: 90,
        },
        {
          symbol: '</>',
          art: 'web',
          ar: 'ابنِ أول موقع ليك',
          en: 'Build your first website',
          descAr: 'تعلّم HTML وCSS خطوة بخطوة، وصمّم صفحة تعبر عنك.',
          descEn: 'Learn HTML and CSS step by step. Design a page that feels like you.',
          resultAr: 'مشروعك: صفحة شخصية',
          resultEn: 'Your project: a personal page',
          price: 450,
          days: 60,
        },
        {
          symbol: 'AI',
          art: 'ai',
          ar: 'افهم الذكاء الاصطناعي',
          en: 'Understand artificial intelligence',
          descAr: 'اعرف معنى البيانات والنماذج، وافهم أمثلة من حياتك اليومية.',
          descEn: 'Explore data and models through examples from everyday life.',
          resultAr: 'هدفك: فهم الأفكار الأساسية',
          resultEn: 'Your goal: understand the foundations',
          price: 500,
          days: 60,
        },
      ];
      function cards(items) {
        return `<div class="grid">${items.map((c) => `<article class="course"><div class="art ${c.art}" aria-hidden="true"><b>${escapeText(c.symbol)}</b></div><div class="body"><span class="tag">${pick('محتوى تجريبي · مناسب للبداية', 'Sample course · a place to start')}</span><h3>${pick(c.ar, c.en)}</h3><p>${pick(c.descAr, c.descEn)}</p><p class="outcome">${pick(c.resultAr, c.resultEn)}</p><div class="price"><strong>${c.price} ${pick('ج.م', 'EGP')}</strong><span class="muted">${c.days} ${pick('يوم وصول', 'days access')}</span></div><button class="pill primary" onclick="notice(pick('عرض توضيحي: هنا ستظهر تفاصيل الدورة وخطط الاشتراك.','Design demo: course details and plans would open here.'))">${pick('شوف تفاصيل الدورة', 'View course details')} ${icon('courses')}</button></div></article>`).join('')}</div>`;
      }
      function home() {
        return `<section class="hero"><div class="wrap"><div class="hero-copy" dir="${lang === 'ar' ? 'rtl' : 'ltr'}"><span class="stamp">${pick('لطلاب المرحلة الثانوية · ١٥–١٨ سنة', 'For secondary students · ages 15–18')}</span><h1>${pick('افهم الفكرة.<br>اكتب الكود.<br><em>ابنِ حاجة ليك.</em>', 'Understand it.<br>Code it.<br><em>Build something yours.</em>')}</h1><p>${pick('ابدأ البرمجة من غير تعقيد. دروس مسجلة واضحة، وتطبيقات تساعدك تحوّل الفهم لحاجة تقدر تعملها بنفسك.', 'Start programming without the confusion. Clear recorded lessons and practical ideas help turn understanding into something you can build.')}</p><div class="actions"><button class="pill primary" onclick="go('courses')">${pick('اكتشف دورتك الأولى', 'Find your first course')} ${icon('courses')}</button><a class="pill secondary" href="#how">${pick('إزاي أبدأ؟', 'How do I start?')}</a></div><p class="slogan">${pick('تعلمها. برمجها. حققها.', 'Learn It. Code It. Get It.')}</p></div></div></section><div class="wrap"><div class="value-strip">${[
          [
            pick('فهم قبل الحفظ', 'Understanding first'),
            pick('شرح بسيط وأمثلة قريبة منك.', 'Clear explanations, relatable examples.'),
          ],
          [
            pick('تطبيق على اللي اتعلمته', 'Apply what you learn'),
            pick('أفكار مشاريع تبدأ بيها بنفسك.', 'Project ideas you can start yourself.'),
          ],
          [
            pick('تعلم يناسب وقتك', 'Learn on your schedule'),
            pick('دروس مسجلة، وتقدمك محفوظ.', 'Recorded lessons and saved progress.'),
          ],
        ]
          .map(
            ([h, p]) => `<article>${icon('learning')}<div><h3>${h}</h3><p>${p}</p></div></article>`,
          )
          .join(
            '',
          )}</div><section class="section"><div class="section-title"><div><span class="eyebrow">${pick('خطوتك الأولى', 'YOUR FIRST STEP')}</span><h2>${pick('اختار البداية اللي تشدّك', 'Choose a beginning that interests you')}</h2><p class="muted">${pick('أسعار وخطط تجريبية للمراجعة — الدورات المنشورة الفعلية هتظهر هنا في الموقع.', 'Sample prices and plans for review. Real published courses will appear here in the application.')}</p></div></div>${cards(courses)}</section><section class="section" id="how"><div class="path"><div><span class="eyebrow">${pick('من الفكرة للتطبيق', 'FROM IDEA TO ACTION')}</span><h2>${pick('بداية واضحة.<br>خطوة بخطوة.', 'A clear start.<br>One step at a time.')}</h2><div class="build"><strong>${pick('تخيل أول مشروع ليك', 'Imagine your first project')}</strong><p class="muted">${pick('لعبة بسيطة، صفحة شخصية، أو فكرة صغيرة تحل مشكلة.', 'A small game, a personal page, or an idea that solves a problem.')}</p></div></div><div class="steps">${[
          [
            pick('اكتشف الدورة المناسبة', 'Find the right course'),
            pick('اقرأ اللي هتتعلمه وخطة الوصول.', 'Read the outcomes and access plan.'),
          ],
          [
            pick('اشحن محفظتك واشترك', 'Fund your wallet and subscribe'),
            pick(
              'قدّم طلب شحن. بعد موافقة الأدمن، اشترِ الدورة بنفسك.',
              'Submit a recharge request. After admin approval, purchase your course.',
            ),
          ],
          [
            pick('اتعلم وارجع من مكانك', 'Learn and pick up where you left off'),
            pick(
              'شاهد الدروس وتابع تقدمك خلال مدة اشتراكك.',
              'Watch lessons and follow your progress during your subscription.',
            ),
          ],
        ]
          .map(
            ([h, p], i) =>
              `<div class="step"><span class="number">0${i + 1}</span><div><h3>${h}</h3><p>${p}</p></div></div>`,
          )
          .join(
            '',
          )}</div></div></section><section class="section faq"><span class="eyebrow">${pick('قبل ما تبدأ', 'BEFORE YOU START')}</span><h2>${pick('أسئلة ممكن تكون في بالك', 'Questions you might have')}</h2><details><summary>${pick('لازم أكون بعرف برمجة؟', 'Do I need programming experience?')}</summary><p>${pick('اقرأ متطلبات كل دورة. أمثلة الدورات هنا تبدأ من المفاهيم الأساسية.', 'Check each course’s prerequisites. The sample courses here start with foundational ideas.')}</p></details><details><summary>${pick('الدروس مباشرة ولا مسجلة؟', 'Are lessons live or recorded?')}</summary><p>${pick('الدروس مسجلة، تقدر ترجع لها خلال مدة اشتراكك.', 'Lessons are recorded. You can return to them during your subscription.')}</p></details><details><summary>${pick('طلب الشحن بيفتح الدورة؟', 'Does a recharge request unlock a course?')}</summary><p>${pick('لا. الأدمن بيتحقق من التحويل ويوافق على الشحن. بعدها بتشتري الدورة من رصيد المحفظة.', 'An admin verifies the transfer and approves the recharge. You then purchase a course using your wallet balance.')}</p></details></section></div>`;
      }
      function catalog() {
        return `<section class="wrap page"><span class="eyebrow">${pick('اكتشف اللي يناسبك', 'FIND YOUR START')}</span><h1>${pick('دورة. فكرة. بداية جديدة.', 'A course. An idea. A new beginning.')}</h1><label for="search" class="muted">${pick('ابحث في الدورات التجريبية', 'Search sample courses')}</label><input class="search" id="search" placeholder="${pick('مثلاً: بايثون أو موقع', 'Try Python or website')}" oninput="searchCourses(this.value)"><div id="results">${cards(courses)}</div></section>`;
      }
      function learning() {
        return `<section class="wrap page"><span class="eyebrow">${pick('مساحة تعلمك', 'YOUR LEARNING SPACE')}</span><h1>${pick('أهلاً يا متعلم. كمّل من هنا.', 'Welcome back. Pick up from here.')}</h1><p class="muted">${pick('بيانات طالب تجريبية لعرض التصميم فقط.', 'Sample student data for this design preview only.')}</p><div class="panel resume"><div><span class="tag">${pick('كمّل تعلمك', 'CONTINUE LEARNING')}</span><h2>${pick(courses[0].ar, courses[0].en)}</h2><p class="muted">${pick('الدرس التالي: الشروط واتخاذ القرارات', 'Next lesson: conditions and decisions')}</p><div class="meter" role="progressbar" aria-label="${pick('التقدم التجريبي', 'Sample progress')}" aria-valuenow="35" aria-valuemin="0" aria-valuemax="100"><span></span></div><p>35% · ${pick('٧ من ٢٠ درس — مثال', '7 of 20 lessons — sample')}</p><p class="muted">${pick('الاشتراك نشط — تاريخ تجريبي', 'Active subscription — sample dates')}</p><button class="pill primary" style="margin-top:20px" onclick="notice(pick('هذا نموذج تصميم. تشغيل الدرس يحتاج اشتراكاً فعلياً وواجهة DRM.','This is a design demo. Playback requires a real subscription and DRM API.'))">${pick('كمّل الدرس', 'Continue lesson')} ${icon('learning')}</button></div><div class="art"><b>if / else</b></div></div><div class="section-title" style="margin-top:40px"><h2>${pick('دوراتك', 'Your courses')}</h2></div>${cards([courses[1]])}</section>`;
      }
      function profile() {
        return `<section class="wrap page"><span class="eyebrow">${pick('حسابك', 'YOUR SPACE')}</span><h1>${pick('كل اللي يخصك في مكان واحد', 'Your account, in one place')}</h1><p class="muted">${pick('مثال تصميم — مفيش تسجيل دخول حقيقي هنا.', 'Design example — there is no real sign-in here.')}</p><div class="panel"><div class="list">${[pick('محفظتي', 'My wallet'), pick('سجل المشتريات', 'Purchase history'), pick('الإشعارات', 'Notifications'), pick('الدورات المحفوظة — مقترح M8', 'Saved courses — M8 proposal')].map((s) => `<button class="row" onclick="notice(pick('رابط توضيحي في نموذج التصميم فقط.','Illustrative link in this design preview only.'))">${s} ${icon('profile')}</button>`).join('')}</div></div></section>`;
      }
      function admin() {
        return `<section class="wrap page"><span class="eyebrow">${pick('مساحة الإدارة', 'ADMIN WORKSPACE')}</span><h1>${pick('صورة أوضح. قرار أسهل.', 'A clearer picture. An easier decision.')}</h1><p class="muted">${pick('مؤشرات تجريبية فقط — ليست إحصاءات للموقع.', 'Sample indicators only — not live platform statistics.')}</p><div class="stats">${[
          [3, pick('دورات تجريبية', 'Sample courses')],
          [2, pick('طلبات شحن للمراجعة — مثال', 'Recharge requests to review — sample')],
          [1, pick('دورة تحتاج استكمال ترجمة — مثال', 'Course needing translation — sample')],
        ]
          .map(([n, s]) => `<article class="stat"><b>${n}</b><span>${s}</span></article>`)
          .join(
            '',
          )}</div><div class="list">${[pick('إدارة الدورات والمحتوى', 'Manage courses and content'), pick('مراجعة طلبات الشحن', 'Review recharge requests'), pick('تقارير المشتريات والشحن — ملخصات فقط', 'Purchase and recharge reports — summaries only')].map((s) => `<button class="row" onclick="notice(pick('مساحة مقترحة: الأرقام والأزرار هنا للتصميم، بدون تنفيذ مالي.','Proposed workspace: these values and controls are illustrative, with no financial mutations.'))">${s} ${icon('admin')}</button>`).join('')}</div></section>`;
      }
      function searchCourses(value) {
        const q = value.trim().toLocaleLowerCase();
        const items = courses.filter((c) =>
          (c.ar + ' ' + c.en + ' ' + c.descAr + ' ' + c.descEn).toLocaleLowerCase().includes(q),
        );
        document.querySelector('#results').innerHTML = items.length
          ? cards(items)
          : `<p class="panel">${pick('مفيش نتيجة. جرّب كلمة تانية.', 'No matches. Try another word.')}</p>`;
      }
      function render() {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        const tabs =
          role === 'admin'
            ? ['admin', 'courses', 'recharges', 'profile']
            : ['home', 'courses', 'learning', 'profile'];
        const labels = {
          home: pick('الرئيسية', 'Home'),
          courses: pick('اكتشف', 'Discover'),
          learning: pick('تعلمي', 'My learning'),
          profile: pick('حسابي', 'Profile'),
          admin: pick('الإدارة', 'Admin'),
          recharges: pick('الشحن', 'Recharges'),
        };
        const nav = tabs
          .map(
            (name) =>
              `<button onclick="go('${name}')" ${page === name ? 'aria-current="page"' : ''}><span class="icon-holder">${icon(name)}</span><span>${labels[name]}</span></button>`,
          )
          .join('');
        document.querySelector('#top-nav').innerHTML = nav;
        document.querySelector('#bottom-nav').innerHTML = nav;
        document.querySelector('#role').textContent =
          role === 'student'
            ? pick('عرض الأدمن', 'Admin preview')
            : pick('عرض الطالب', 'Student preview');
        document.querySelector('#language').textContent = lang === 'ar' ? 'EN' : 'العربية';
        document.querySelector('#demo-label').textContent = pick(
          'نموذج تصميم M8 · محتوى وبيانات تجريبية · الشعار إعادة رسم للمراجعة',
          'M8 design preview · sample data · reconstructed logo for review',
        );
        document.querySelector('#foot-note').textContent = pick(
          'برمجة لطلاب المرحلة الثانوية. خطوة بخطوة.',
          'Programming for secondary students. One step at a time.',
        );
        document.querySelector('#content').innerHTML = (
          { home, courses: catalog, learning, profile, admin, recharges: admin }[page] || home
        )();
      }
      function go(next) {
        page = next;
        render();
        window.scrollTo(0, 0);
        document.querySelector('#content').focus({ preventScroll: true });
      }
      function toggleLang() {
        lang = lang === 'ar' ? 'en' : 'ar';
        render();
      }
      function toggleRole() {
        role = role === 'student' ? 'admin' : 'student';
        page = role === 'admin' ? 'admin' : 'home';
        go(page);
      }
      function toggleTheme() {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        document.querySelector('#theme').textContent = next === 'dark' ? '☀' : '☾';
      }
      function notice(text) {
        const n = document.querySelector('#toast');
        n.textContent = text;
        n.hidden = false;
        clearTimeout(timer);
        timer = setTimeout(() => (n.hidden = true), 5000);
      }
      render();
    </script>
  </body>
</html>
