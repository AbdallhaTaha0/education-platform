name = "fayq-education-platform"
main = "server/src/worker.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

[alias]
"iconv-lite" = "./server/src/infra/iconv-shim.ts"
"pino" = "./server/src/infra/pino-shim.ts"
"pino-http" = "./server/src/infra/pino-http-shim.ts"

[vars]
NODE_ENV = "production"
COOKIE_SECURE = "true"
AUTH_ISSUER = "fayq-education-platform"
AUTH_AUDIENCE = "fayq-education-platform"
CODING_IDE_ENABLED = "false"

[assets]
directory = "client/dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*", "/ar", "/ar/*", "/en", "/en/*", "/", "/courses/*", "/packages/*", "/support", "/terms", "/privacy", "/refunds", "/sitemap.xml", "/robots.txt"]

[[d1_databases]]
binding = "DB"
database_name = "fayq-platform-db"
database_id = "3dab8ac6-cada-4dfe-ade2-d06fca2d4d38"
migrations_dir = "server/migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "fayq-lesson-files-prod"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "b21c5d5a050447d1850685744bf0d3f4"

[durable_objects]
bindings = [
  { name = "MUTEX_DO", class_name = "MutexDurableObject" },
  { name = "USER_REALTIME_DO", class_name = "UserRealtimeDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MutexDurableObject", "UserRealtimeDurableObject"]

[triggers]
crons = ["*/5 * * * *", "0 2 * * *"]
