services:
  migrate:
    image: fayq-materials-final-migrate:20261004
    environment: { DATABASE_URL: 'postgresql://materials:synthetic_materials_test_only@postgres:5432/course_learning_test' }
    depends_on: { postgres: { condition: service_healthy } }
  server:
    image: fayq-materials-final-server:20261004
    env_file: ../browser/evidence/materials-ui/server.env.local
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://materials:synthetic_materials_test_only@postgres:5432/course_learning_test
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: http://localhost:8080
      COOKIE_SECURE: 'false'
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: materials-test
      STORAGE_SECRET_ACCESS_KEY: synthetic_materials_storage_only
      STORAGE_BUCKET: course-learning
      STORAGE_REQUEST_TIMEOUT_MS: '2000'
      STORAGE_MAX_RETRIES: '1'
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy }, minio: { condition: service_healthy } }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  client:
    image: fayq-materials-final-client:20261004
  nginx:
    image: fayq-materials-final-nginx:20261004
    ports: ['127.0.0.1:8093:8080']
    depends_on: { server: { condition: service_healthy }, client: { condition: service_started } }
