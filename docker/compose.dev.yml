# Local development stack (M3 catalog + DRM adapter).
#
# Usage (repository root). --env-file is required because Compose otherwise
# reads docker/.env instead of the ignored root .env that holds the local
# AUTH_JWT_SECRET (no default exists by design — startup fails closed):
#   docker compose --env-file .env -f docker/compose.dev.yml config --quiet
#   docker compose --env-file .env -f docker/compose.dev.yml build
#   docker compose --env-file .env -f docker/compose.dev.yml up -d --wait
#   docker compose --env-file .env -f docker/compose.dev.yml down   # keeps data
#
# Public entry point: http://localhost:8080 (Nginx).
# Only the Nginx port is published; postgres/redis are reachable inside the
# Compose network only. Query them via `docker compose ... exec`, e.g.:
#   docker compose -f docker/compose.dev.yml exec postgres psql -U postgres -d education_platform -c 'SELECT 1'
#
# Startup ordering: postgres/redis healthchecks -> migrate (one-shot
# `prisma migrate deploy`; failure exits non-zero and DEPENDENT server
# startup is blocked via service_completed_successfully) -> server (liveness
# healthcheck) -> client (static probe) -> nginx (healthy on both proxy
# paths, waits for healthy server AND client).
# Replicas: `... up -d --scale server=3` (same image; Nginx round-robins).

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SERVICE_VERSION: ${SERVICE_VERSION:-0.4.0-m4}
  READY_TIMEOUT_MS: ${READY_TIMEOUT_MS:-2000}

name: education-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-education_platform}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-education_platform}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: migrate
    image: edu-platform-migrate:0.4.0-m4
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-education_platform}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: runtime
    image: edu-platform-server:0.4.0-m4
    environment:
      <<: *common-env
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-education_platform}
      REDIS_URL: redis://redis:6379
      # Identity/auth (server-only). AUTH_JWT_SECRET must be strong (32+
      # chars); keep the real local value in the ignored root .env, never
      # in compose files or the frontend build.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-edu-platform-dev}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-edu-platform-dev-web}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      # Local Docker HTTP explicitly disables Secure cookies. Production
      # builds fail closed unless COOKIE_SECURE=true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # External DRM adapter (M3): all-or-none; unset is fine for non-media work.
      # Readiness never gates on DRM. DRM-dependent mutations fail closed 503.
      DRM_BASE_URL: ${DRM_BASE_URL:-}
      DRM_CLIENT_ID: ${DRM_CLIENT_ID:-}
      DRM_CLIENT_SECRET: ${DRM_CLIENT_SECRET:-}
      DRM_REQUEST_TIMEOUT_MS: ${DRM_REQUEST_TIMEOUT_MS:-5000}
      DRM_MAX_RETRIES: ${DRM_MAX_RETRIES:-2}
      # M5 playback assertion trust. Real DRM verifies RS256 through the
      # platform's public JWKS endpoint. HS256 is test-fixture-only.
      DRM_ASSERTION_ISSUER: ${DRM_ASSERTION_ISSUER:-}
      DRM_ASSERTION_AUDIENCE: ${DRM_ASSERTION_AUDIENCE:-}
      DRM_ASSERTION_PRIVATE_KEY_B64: ${DRM_ASSERTION_PRIVATE_KEY_B64:-}
      DRM_ASSERTION_KEY_ID: ${DRM_ASSERTION_KEY_ID:-}
      DRM_ASSERTION_MODE: ${DRM_ASSERTION_MODE:-}
      DRM_ASSERTION_SECRET: ${DRM_ASSERTION_SECRET:-}
      DRM_ASSERTION_MAX_LIFETIME_SEC: ${DRM_ASSERTION_MAX_LIFETIME_SEC:-120}
      DRM_PUBLIC_BASE_URL: ${DRM_PUBLIC_BASE_URL:-}
      # M4 manual funding (server-only deployment config): JSON array of
      # approved receiving channels. Unset = explicitly unconfigured (M4
      # endpoints answer 503 PAYMENT_UNCONFIGURED). Never commit real
      # receiving identifiers; tests use fixture values.
      PAYMENT_CHANNELS: ${PAYMENT_CHANNELS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 15s
    # Liveness probe (not readiness): uses the node runtime already in the
    # image, no extra packages. /health/live never touches dependencies.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/health/live'').then((r)=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  client:
    build:
      context: ..
      dockerfile: client/Dockerfile
    image: edu-platform-client:0.4.0-m4
    depends_on:
      - server
    # Static-file probe via the busybox wget shipped in the image.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    image: edu-platform-nginx:0.4.0-m4
    ports:
      # Host port is overridable so isolated projects (browser tests) can run
      # beside development: NGINX_PORT=8081 docker compose -p other ...
      - '${NGINX_PORT:-8080}:8080'
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_healthy
    # Proves both proxy paths through the entry point: frontend shell and
    # backend liveness. Busybox wget is already in the image.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/api/health/live',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Explicitly labeled DRM HTTP contract fixture (TEST-ONLY browser profile).
  # NEVER packaged into production runtime images; NOT real DRM/R2 evidence.
  # Browser projects point the platform server at it via
  # DRM_BASE_URL=http://drm-fixture:8090 + the fixture test credentials below.
  drm-fixture:
    build:
      context: ..
      dockerfile: docker/drm-fixture/Dockerfile
    image: edu-platform-drm-fixture:0.4.0-m4
    profiles: ['browser']
    environment:
      PORT: 8090
      FIXTURE_CLIENT_ID: ${DRM_CLIENT_ID:-fixture-client}
      FIXTURE_CLIENT_SECRET: ${DRM_CLIENT_SECRET:-fixture-secret-that-is-long-enough-0123456789}
      # M5: the platform signs the playback assertion; the fixture verifies it.
      FIXTURE_ASSERTION_ISSUER: ${DRM_ASSERTION_ISSUER:-}
      FIXTURE_ASSERTION_AUDIENCE: ${DRM_ASSERTION_AUDIENCE:-}
      FIXTURE_ASSERTION_SECRET: ${DRM_ASSERTION_SECRET:-}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:8090/v1/media'',{method:''POST'',headers:{''Content-Type'':''application/json'',''X-Client-Id'':''x'',''X-Client-Secret'':''y''},body:''{}''}).then(()=>process.exit(0)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: 'no'

  # Containerized M3/M4 browser harness (test-only profile, never started by
  # default). Runs Chromium assertions through Nginx against a DISPOSABLE
  # project.
  #
  # SAFETY: the pinned development volumes (docker_pgdata / docker_redisdata) are
  # the DEFAULT for this file. Any `-p` invocation that omits PGDATA_NAME /
  # REDISDATA_NAME therefore reuses development data, and a later `down -v`
  # would delete it. On PowerShell set the overrides as SESSION variables ONCE,
  # before the first command, so every following `config`, `up`, `run` and
  # `down -v` in the same shell receives them. Prefix-style `VAR=value command`
  # syntax does NOT exist in PowerShell and would silently leave the defaults
  # in place.
  #
  #   # 1. Disposable session overrides (PowerShell session scope)
  #   $env:PGDATA_NAME    = 'education-platform-browser_pgdata'
  #   $env:REDISDATA_NAME = 'education-platform-browser_redisdata'
  #   $env:NGINX_PORT     = '8081'
  #   $env:ALLOWED_ORIGINS        = 'http://localhost:8081,http://nginx:8080'
  #   $env:DRM_BASE_URL           = 'http://drm-fixture:8090'
  #   $env:DRM_CLIENT_ID          = 'fixture-client'
  #   $env:DRM_CLIENT_SECRET      = 'fixture-secret-that-is-long-enough-0123456789'
  #   $env:DRM_ASSERTION_ISSUER   = 'http://localhost:8081'
  #   $env:DRM_ASSERTION_AUDIENCE = 'edu-drm-fixture'
  #   $env:DRM_ASSERTION_MODE     = 'fixture-hs256'
  #   $env:DRM_ASSERTION_SECRET   = '<test-only value, at least 32 characters>'
  #   $env:DRM_PUBLIC_BASE_URL    = 'http://localhost:8091'
  #   $env:PAYMENT_CHANNELS       = '<test-only JSON array>'
  #   $env:BROWSER_ADMIN_EMAIL    = '<test-only address>'
  #   $env:BROWSER_ADMIN_PHONE    = '<test-only number>'
  #   $env:BROWSER_ADMIN_PASSWORD = '<test-only password>'
  #
  #   # 2. Inspect the rendered names BEFORE creating anything
  #   docker compose --env-file .env -p education-platform-browser -f docker/compose.dev.yml --profile browser config | Select-String 'name: (docker_|education-)'
  #   #   must print education-platform-browser_pgdata and education-platform-browser_redisdata
  #   #   and must NOT print docker_pgdata or docker_redisdata
  #
  #   # 3. Start the disposable stack
  #   docker compose --env-file .env -p education-platform-browser -f docker/compose.dev.yml --profile browser up -d --wait
  #
  #   # 4. Bootstrap the throwaway admin (test-only values, never committed)
  #   docker compose --env-file .env -p education-platform-browser -f docker/compose.dev.yml --profile browser run --rm --no-deps -e BOOTSTRAP_ADMIN_NAME='...' -e BOOTSTRAP_ADMIN_EMAIL="$env:BROWSER_ADMIN_EMAIL" -e BOOTSTRAP_ADMIN_PHONE="$env:BROWSER_ADMIN_PHONE" -e BOOTSTRAP_ADMIN_PASSWORD="$env:BROWSER_ADMIN_PASSWORD" server node dist/bootstrap.js
  #
  #   # 5. Run the browser assertions
  #   docker compose --env-file .env -p education-platform-browser -f docker/compose.dev.yml --profile browser run --rm browser
  #
  #   # 6. Re-inspect the rendered names, then prove they are the disposable ones
  #   #    immediately before `down -v`.
  #   $rendered = docker compose --env-file .env -p education-platform-browser -f docker/compose.dev.yml --profile browser config | Select-String 'name: (docker_|education-)'
  #   $rendered
  #   if ($rendered -match 'docker_pgdata|docker_redisdata') { throw 'REFUSING down -v: a development volume name is resolved' }
  #   if (-not ($rendered -match 'education-platform-browser_pgdata' -and $rendered -match 'education-platform-browser_redisdata')) { throw 'REFUSING down -v: disposable volume names not resolved' }
  #   docker compose --env-file .env -p education-platform-browser -f docker/compose.dev.yml --profile browser down -v
  #
  #   # 7. Clear the session overrides so later commands cannot inherit them
  #   'PGDATA_NAME','REDISDATA_NAME','NGINX_PORT','ALLOWED_ORIGINS','DRM_BASE_URL','DRM_CLIENT_ID','DRM_CLIENT_SECRET','DRM_ASSERTION_ISSUER','DRM_ASSERTION_AUDIENCE','DRM_ASSERTION_PRIVATE_KEY_B64','DRM_ASSERTION_KEY_ID','DRM_ASSERTION_MODE','DRM_ASSERTION_SECRET','DRM_PUBLIC_BASE_URL','PAYMENT_CHANNELS','BROWSER_ADMIN_EMAIL','BROWSER_ADMIN_PHONE','BROWSER_ADMIN_PASSWORD' | ForEach-Object { Remove-Item "Env:$_" -ErrorAction SilentlyContinue }
  # Bootstrap admin credentials arrive via environment (never committed).
  browser:
    build:
      context: ..
      dockerfile: docker/browser/Dockerfile
    image: edu-platform-browser:0.4.0-m4
    profiles: ['browser']
    environment:
      BASE_URL: http://nginx:8080
      EVIDENCE_DIR: /srv/browser/evidence
      M5_EVIDENCE_DIR: /srv/browser/m5-evidence
      ADMIN_EMAIL: ${BROWSER_ADMIN_EMAIL:-}
      ADMIN_PHONE: ${BROWSER_ADMIN_PHONE:-}
      ADMIN_PASSWORD: ${BROWSER_ADMIN_PASSWORD:-}
    volumes:
      - ../reports-and-markdown-files/m3-evidence:/srv/browser/evidence
      - ../reports-and-markdown-files/m5-evidence:/srv/browser/m5-evidence
      - ../docker/browser/fixtures:/srv/browser/fixtures:ro
    depends_on:
      nginx:
        condition: service_healthy
    restart: 'no'

volumes:
  # Persistent development data: survives `down` and normal container
  # restarts. Destroy ONLY deliberately: `... down -v` (non-destructive
  # rollback never uses -v; see m1-implementation-report.md).
  # Volume names default to the accepted development volumes (docker_pgdata /
  # docker_redisdata) so the pre-existing dev database is preserved when the
  # stable project name `education-platform` is used. Disposable verification
  # projects (browser, R2 lifecycle) MUST override PGDATA_NAME / REDISDATA_NAME
  # to isolated names so `down -v` never deletes development data.
  pgdata:
    # Preserve the accepted development database created before the stack had
    # an explicit Compose project name.
    name: ${PGDATA_NAME:-docker_pgdata}
  redisdata:
    name: ${REDISDATA_NAME:-docker_redisdata}
