# Local development stack (M3 catalog + DRM adapter).
#
# Usage (repository root). --env-file is required because Compose otherwise
# reads docker/.env instead of the ignored root .env that holds the local
# AUTH_JWT_SECRET (no default exists by design — startup fails closed):
#   docker compose --env-file .env -f docker/compose.dev.yml config --quiet
#   docker compose --env-file .env -f docker/compose.dev.yml build
#   docker compose --env-file .env -f docker/compose.dev.yml up -d --wait
#   docker compose --env-file .env -f docker/compose.dev.yml down   # keeps data
#
# Public entry point: http://localhost:8080 (Nginx).
# Only the Nginx port is published; postgres/redis are reachable inside the
# Compose network only. Query them via `docker compose ... exec`, e.g.:
#   docker compose -f docker/compose.dev.yml exec postgres psql -U postgres -d education_platform -c 'SELECT 1'
#
# Startup ordering: postgres/redis healthchecks -> migrate (one-shot
# `prisma migrate deploy`; failure exits non-zero and DEPENDENT server
# startup is blocked via service_completed_successfully) -> server (liveness
# healthcheck) -> client (static probe) -> nginx (healthy on both proxy
# paths, waits for healthy server AND client).
# Replicas: `... up -d --scale server=3` (same image; Nginx round-robins).

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SERVICE_VERSION: ${SERVICE_VERSION:-0.3.0-m3}
  READY_TIMEOUT_MS: ${READY_TIMEOUT_MS:-2000}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-education_platform}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-education_platform}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: migrate
    image: edu-platform-migrate:0.3.0-m3
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-education_platform}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: runtime
    image: edu-platform-server:0.3.0-m3
    environment:
      <<: *common-env
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-education_platform}
      REDIS_URL: redis://redis:6379
      # Identity/auth (server-only). AUTH_JWT_SECRET must be strong (32+
      # chars); keep the real local value in the ignored root .env, never
      # in compose files or the frontend build.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-edu-platform-dev}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-edu-platform-dev-web}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      # Local Docker HTTP explicitly disables Secure cookies. Production
      # builds fail closed unless COOKIE_SECURE=true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # External DRM adapter (M3): all-or-none; unset is fine for non-media work.
      # Readiness never gates on DRM. DRM-dependent mutations fail closed 503.
      DRM_BASE_URL: ${DRM_BASE_URL:-}
      DRM_CLIENT_ID: ${DRM_CLIENT_ID:-}
      DRM_CLIENT_SECRET: ${DRM_CLIENT_SECRET:-}
      DRM_REQUEST_TIMEOUT_MS: ${DRM_REQUEST_TIMEOUT_MS:-5000}
      DRM_MAX_RETRIES: ${DRM_MAX_RETRIES:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 15s
    # Liveness probe (not readiness): uses the node runtime already in the
    # image, no extra packages. /health/live never touches dependencies.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health/live').then((r)=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  client:
    build:
      context: ..
      dockerfile: client/Dockerfile
    image: edu-platform-client:0.3.0-m3
    depends_on:
      - server
    # Static-file probe via the busybox wget shipped in the image.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    image: edu-platform-nginx:0.3.0-m3
    ports:
      # Host port is overridable so isolated projects (browser tests) can run
      # beside development: NGINX_PORT=8081 docker compose -p other ...
      - "${NGINX_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_healthy
    # Proves both proxy paths through the entry point: frontend shell and
    # backend liveness. Busybox wget is already in the image.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/api/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Explicitly labeled DRM HTTP contract fixture (TEST-ONLY browser profile).
  # NEVER packaged into production runtime images; NOT real DRM/R2 evidence.
  # Browser projects point the platform server at it via
  # DRM_BASE_URL=http://drm-fixture:8090 + the fixture test credentials below.
  drm-fixture:
    build:
      context: ..
      dockerfile: docker/drm-fixture/Dockerfile
    image: edu-platform-drm-fixture:0.3.0-m3
    profiles: ["browser"]
    environment:
      PORT: 8090
      FIXTURE_CLIENT_ID: ${DRM_CLIENT_ID:-fixture-client}
      FIXTURE_CLIENT_SECRET: ${DRM_CLIENT_SECRET:-fixture-secret-that-is-long-enough-0123456789}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8090/v1/media',{method:'POST',headers:{'Content-Type':'application/json','X-Client-Id':'x','X-Client-Secret':'y'},body:'{}'}).then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: "no"

  # Containerized M3 browser harness (test-only profile, never started by
  # default). Runs Chromium assertions through Nginx against an isolated
  # project, e.g.:
  #   DRM_BASE_URL=http://drm-fixture:8090 DRM_CLIENT_ID=fixture-client DRM_CLIENT_SECRET=fixture-secret-that-is-long-enough-0123456789 \
  #     docker compose -p education-platform-browser -f docker/compose.dev.yml --profile browser up -d --wait
  #   docker compose -p education-platform-browser -f docker/compose.dev.yml --profile browser run --rm browser
  # Bootstrap admin credentials arrive via environment (never committed).
  browser:
    build:
      context: ..
      dockerfile: docker/browser/Dockerfile
    image: edu-platform-browser:0.3.0-m3
    profiles: ["browser"]
    environment:
      BASE_URL: http://nginx:8080
      EVIDENCE_DIR: /srv/browser/evidence
      ADMIN_EMAIL: ${BROWSER_ADMIN_EMAIL:-}
      ADMIN_PHONE: ${BROWSER_ADMIN_PHONE:-}
      ADMIN_PASSWORD: ${BROWSER_ADMIN_PASSWORD:-}
    volumes:
      - ../reports-and-markdown-files/m3-evidence:/srv/browser/evidence
      - ../docker/browser/fixtures:/srv/browser/fixtures:ro
    depends_on:
      nginx:
        condition: service_healthy
    restart: "no"

volumes:
  # Persistent development data: survives `down` and normal container
  # restarts. Destroy ONLY deliberately: `... down -v` (non-destructive
  # rollback never uses -v; see m1-implementation-report.md).
  pgdata:
  redisdata:
