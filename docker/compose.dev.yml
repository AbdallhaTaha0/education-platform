# Local development stack (M1 Docker foundation).
#
# Usage (repository root):
#   docker compose -f docker/compose.dev.yml config --quiet   # parse check
#   docker compose -f docker/compose.dev.yml build            # build images
#   docker compose -f docker/compose.dev.yml up -d --wait     # start in order
#   docker compose -f docker/compose.dev.yml down             # stop (keeps data)
#
# Public entry point: http://localhost:8080 (Nginx).
# Only the Nginx port is published; postgres/redis are reachable inside the
# Compose network only. Query them via `docker compose ... exec`, e.g.:
#   docker compose -f docker/compose.dev.yml exec postgres psql -U postgres -d education_platform -c 'SELECT 1'
#
# Startup ordering: postgres/redis healthchecks -> migrate (one-shot
# `prisma migrate deploy`; failure exits non-zero and DEPENDENT server
# startup is blocked via service_completed_successfully) -> server -> nginx.
# Replicas: `... up -d --scale server=3` (same image; Nginx round-robins).

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0-m1}
  READY_TIMEOUT_MS: ${READY_TIMEOUT_MS:-2000}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-education_platform}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-education_platform}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: migrate
    image: edu-platform-migrate:0.1.0-m1
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-education_platform}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: runtime
    image: edu-platform-server:0.1.0-m1
    environment:
      <<: *common-env
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-education_platform}
      REDIS_URL: redis://redis:6379
      # Optional external DRM (M1: unset is fine; readiness never gates on it).
      DRM_BASE_URL: ${DRM_BASE_URL:-}
      DRM_CLIENT_ID: ${DRM_CLIENT_ID:-}
      DRM_CLIENT_SECRET: ${DRM_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 15s

  client:
    build:
      context: ..
      dockerfile: client/Dockerfile
    image: edu-platform-client:0.1.0-m1
    depends_on:
      - server

  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    image: edu-platform-nginx:0.1.0-m1
    ports:
      - "8080:8080"
    depends_on:
      server:
        condition: service_started
      client:
        condition: service_started

volumes:
  # Persistent development data: survives `down` and normal container
  # restarts. Destroy ONLY deliberately: `... down -v` (non-destructive
  # rollback never uses -v; see m1-implementation-report.md).
  pgdata:
  redisdata:
