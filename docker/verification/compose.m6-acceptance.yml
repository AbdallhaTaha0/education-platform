# Paired with compose.m6-delivery-browser.yml, project m6-acceptance only.
# Test-only routing provenance and checkpoints; no published ports.
services:
  server:
    volumes: &probe-mounts
      - ./m6-acceptance-probe.cjs:/verification/probe.cjs:ro
      - ${M6_EVIDENCE_ROOT:?provide an ignored evidence directory}:/evidence
  server-b:
    extends:
      file: compose.m6-delivery-browser.yml
      service: server
    volumes: *probe-mounts
  nginx:
    volumes:
      - ./nginx.m6-acceptance.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server-b:
        condition: service_healthy
