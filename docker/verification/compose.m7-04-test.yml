# M7-04 test-stack override: pin migrate/test to the Vitest 4.1.11 / Vite 6.4.3
# images. Full build/test/migration assembly comes from the changed checkout
# through server/Dockerfile; serving-layer omissions from M7-03 are preserved.
# Use ONLY with project m7-04-test:
#   docker compose -p m7-04-test -f docker/compose.test.yml \
#     -f docker/verification/compose.m7-04-test.yml config
services:
  migrate:
    image: edu-platform-migrate:0.7.0-m7-04-tooling
  test:
    image: edu-platform-server-test:0.7.0-m7-04-tooling
