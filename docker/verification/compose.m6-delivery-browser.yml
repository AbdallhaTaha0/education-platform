# Isolated runtime browser verification. No host ports or development volumes.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: education_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d education_platform"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    image: edu-platform-migrate:0.5.0-m5-rs256verify
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/education_platform
    depends_on:
      postgres:
        condition: service_healthy
  server:
    image: edu-platform-server:0.5.0-m5-rs256verify
    environment:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/education_platform
      REDIS_URL: redis://redis:6379
      AUTH_JWT_SECRET: m6-browser-fixture-only-0123456789abcdef0123456789
      AUTH_ISSUER: m6-browser-fixture
      AUTH_AUDIENCE: m6-browser-fixture-web
      ALLOWED_ORIGINS: http://localhost:8082
      M6_FIXTURE_ENTRY: http://nginx:8082
      ARGON2_MEMORY_KB: 8192
      ARGON2_TIME_COST: 2
      ARGON2_PARALLELISM: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 20
  client:
    image: edu-platform-client:0.5.0-m5-rs256verify
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      # Generated from the actual proxy config; only internal listen port differs.
      - ./nginx.m6-test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_started
volumes:
  pgdata:
