# Read-only local design preview. API responses are labeled illustrative doubles.
# Never use this configuration in a platform deployment.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location = /api/catalog/courses {
    default_type application/json;
    alias /demo/catalog.json;
  }
  location ~ ^/api/catalog/courses/([a-z0-9-]+)$ {
    default_type application/json;
    alias /demo/$1.json;
  }
  location = /api/catalog/packages {
    default_type application/json;
    alias /demo/packages.json;
  }
  location ~ ^/api/catalog/packages/([a-z0-9-]+)$ {
    default_type application/json;
    alias /demo/package-$1.json;
  }
  location /api/auth/ {
    default_type application/json;
    return 401 '{"error":{"code":"UNAUTHENTICATED","message":"Sign-in is unavailable in this read-only design preview."}}';
  }
  location /api/ {
    default_type application/json;
    return 501 '{"error":{"code":"SERVICE_ERROR","message":"This preview contains illustrative courses only. Account and payment actions are unavailable."}}';
  }
  location / {
    try_files $uri $uri/ /index.html;
    sub_filter_once on;
    sub_filter '<body>' '<body><div style="padding:10px 16px;text-align:center;background:#f7b500;color:#0f1f12;font:700 13px/1.6 sans-serif">معاينة التصميم • دورات وأسعار توضيحية • تسجيل الدخول والدفع غير متاحين<br>Design preview • Sample courses and prices • Sign-in and payments disabled</div>';
  }
}
