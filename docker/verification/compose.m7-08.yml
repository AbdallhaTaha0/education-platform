# Disposable local rehearsal only. No public ports; never use existing preview volumes.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: m7-local-fixture-only
      POSTGRES_DB: education_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d education_platform']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: edu-platform-migrate:0.8.0-m8-final
    environment:
      DATABASE_URL: postgresql://postgres:m7-local-fixture-only@postgres:5432/education_platform
    depends_on:
      postgres:
        condition: service_healthy
  server:
    image: edu-platform-server:0.8.0-m8-final
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:m7-local-fixture-only@postgres:5432/education_platform
      REDIS_URL: redis://redis:6379
      AUTH_JWT_SECRET: m7-isolated-rehearsal-only-0123456789abcdef0123456789
      AUTH_ISSUER: m7-local-fixture
      AUTH_AUDIENCE: m7-local-fixture-web
      ALLOWED_ORIGINS: https://m7-fixture.example.test
      COOKIE_SECURE: 'true'
      # Nonexistent external URL and disposable RS256 key: config rehearsal only.
      # No media request is made, and this is not real DRM evidence.
      DRM_BASE_URL: https://drm-fixture.example.test
      DRM_CLIENT_ID: m7-fixture-only
      DRM_CLIENT_SECRET: m7-fixture-only-unused
      DRM_ASSERTION_ISSUER: m7-local-fixture
      DRM_ASSERTION_AUDIENCE: m7-drm-fixture
      DRM_ASSERTION_KEY_ID: m7-disposable-rsa
      DRM_ASSERTION_PRIVATE_KEY_B64: ${M7_FIXTURE_KEY:?generate isolated fixture key first}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
  edge:
    image: edu-platform-railway-edge:0.7.0-m7-08
    environment:
      BACKEND_HOST: server
      BACKEND_PORT: '3000'
      PORT: '8080'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:8080/api/health/ready]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  pgdata:
  redisdata:
