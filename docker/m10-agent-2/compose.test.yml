# Agent-2 M10 backend tests: disposable project, isolated DB, distinct image tags.
#   docker compose -p education-platform-m10-agent-2 -f docker/m10-agent-2/compose.test.yml build
#   docker compose -p education-platform-m10-agent-2 -f docker/m10-agent-2/compose.test.yml up -d --wait migrate
#   docker compose -p education-platform-m10-agent-2 -f docker/m10-agent-2/compose.test.yml run --rm test
#   docker compose -p education-platform-m10-agent-2 -f docker/m10-agent-2/compose.test.yml down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: education_platform_m10a2_test
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata-m10a2:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d education_platform_m10a2_test']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: ../..
      dockerfile: server/Dockerfile
      target: migrate
    image: edu-platform-migrate-m10a2:0.4.0
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/education_platform_m10a2_test
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  test:
    build:
      context: ../..
      dockerfile: server/Dockerfile
      target: test
    image: edu-platform-server-test-m10a2:0.4.0
    environment:
      NODE_ENV: test
      LOG_LEVEL: warn
      SERVICE_VERSION: 0.4.0-m10a2-test
      READY_TIMEOUT_MS: 2000
      DRM_REQUEST_TIMEOUT_MS: 1000
      DRM_MAX_RETRIES: 2
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/education_platform_m10a2_test
      REDIS_URL: redis://redis:6379
      AUTH_JWT_SECRET: 9f3k7q2m4x8z1v6n7h2j5t9w3q6w8e1r5t9y2u4i6o0p
      AUTH_ISSUER: edu-platform-m10a2-test
      STUDENT_DATA_ENCRYPTION_KEY_B64: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      STUDENT_DATA_INDEX_KEY_B64: YmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmI=
      AUTH_AUDIENCE: edu-platform-m10a2-test-web
      ALLOWED_ORIGINS: http://localhost:8080
      ARGON2_MEMORY_KB: 8192
      ARGON2_TIME_COST: 2
      ARGON2_PARALLELISM: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: 'no'
    command: ["npx", "vitest", "run", "tests/integration/m10-parent-reports.test.ts"]

volumes:
  pgdata-m10a2:
