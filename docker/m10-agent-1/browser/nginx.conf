# Owned test-only nginx for the M10 browser probe (agent 1).
# Same-origin page + /api proxy so real cookies/CSRF attach. No caching of
# the probe document. Disposable with the m10-agent-1-browser project.
upstream backend {
  server server:3000;
}

server {
  listen 8080;
  server_name _;

  location /api/ {
    proxy_pass http://backend/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location / {
    root /probe;
    index index.html;
    expires -1;
    add_header Cache-Control "no-store";
  }
}
