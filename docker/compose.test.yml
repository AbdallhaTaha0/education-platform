# Isolated automated-test stack. ALWAYS run with a disposable project name so
# test containers/volumes never touch development data or anything else:
#
#   docker compose -p education-platform-test -f docker/compose.test.yml build
#   docker compose -p education-platform-test -f docker/compose.test.yml up -d --wait migrate
#   docker compose -p education-platform-test -f docker/compose.test.yml run --rm test
#   docker compose -p education-platform-test -f docker/compose.test.yml down -v
#
# The `test` service runs server unit tests (stubbed I/O) plus integration
# tests against these REAL postgres/redis containers and asserts the m1_init
# migration was applied. No ports are published. The write-smoke fixture uses
# a transient table that is never part of Prisma migrations.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: education_platform_test
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d education_platform_test']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: migrate
    image: edu-platform-migrate-test:0.4.0-m4
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/education_platform_test
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  test:
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: test
    image: edu-platform-server-test:0.4.0-m4
    environment:
      NODE_ENV: test
      # Existing IDE regression suites explicitly exercise the enabled contract.
      CODING_IDE_ENABLED: 'true'
      LOG_LEVEL: warn
      SERVICE_VERSION: 0.4.0-m4-test
      READY_TIMEOUT_MS: 2000
      DRM_REQUEST_TIMEOUT_MS: 1000
      DRM_MAX_RETRIES: 2
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/education_platform_test
      REDIS_URL: redis://redis:6379
      # Isolated test-only secrets. Distinct from every other environment;
      # never production credentials.
      AUTH_JWT_SECRET: 9f3k7q2m4x8z1v6n7h2j5t9w3q6w8e1r5t9y2u4i6o0p
      AUTH_ISSUER: edu-platform-test
      # Synthetic disposable-suite keys only; local/production keys are random.
      STUDENT_DATA_ENCRYPTION_KEY_B64: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      STUDENT_DATA_INDEX_KEY_B64: YmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmI=
      AUTH_AUDIENCE: edu-platform-test-web
      ALLOWED_ORIGINS: http://localhost:8080
      # Reduced Argon2id cost for suite speed only (production uses 65536/3/4).
      ARGON2_MEMORY_KB: 8192
      ARGON2_TIME_COST: 2
      ARGON2_PARALLELISM: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: 'no'

  # Client-side unit tests for the pure M5 learning logic (player state machine
  # and the transient credential boundary). No database or redis required.
  client-test:
    build:
      context: ..
      dockerfile: client/Dockerfile
      target: test
    image: edu-platform-client-test:0.5.0-m5
    restart: 'no'

volumes:
  # Disposable by design: the project prefix (-p education-platform-test)
  # keeps these separate from development volumes; `down -v` removes them.
  pgdata-test:
