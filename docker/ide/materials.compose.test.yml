services:
  minio:
    image: fayq-materials-minio-fixture:20261004
    environment: { MINIO_ROOT_USER: materials-test, MINIO_ROOT_PASSWORD: synthetic_materials_storage_only }
    volumes: [objects-test:/data]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:9000/minio/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  server:
    environment:
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: materials-test
      STORAGE_SECRET_ACCESS_KEY: synthetic_materials_storage_only
      STORAGE_BUCKET: course-learning
    depends_on:
      minio: { condition: service_healthy }
volumes:
  objects-test:
