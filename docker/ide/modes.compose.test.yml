# Disposable only: no owner env files, host ports or retained volumes.
name: fayq-ide-modes-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: education_platform_test
    volumes: ['pg-test:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d education_platform_test']
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    volumes: ['redis-test:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    image: fayq-ide-modes-server:test
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/education_platform_test
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres: { condition: service_healthy }
  server:
    image: fayq-ide-modes-server:test
    command: ['node', 'dist/index.js']
    environment: &env
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/education_platform_test
      REDIS_URL: redis://redis:6379
      AUTH_JWT_SECRET: synthetic-ide-modes-secret-never-production-0123456789
      AUTH_ISSUER: ide-modes-test
      STUDENT_DATA_ENCRYPTION_KEY_B64: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      STUDENT_DATA_INDEX_KEY_B64: YmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmI=
      AUTH_AUDIENCE: ide-modes-browser
      ALLOWED_ORIGINS: http://nginx:8080,http://localhost:8080
      COOKIE_SECURE: 'false'
      ARGON2_MEMORY_KB: 8192
      ARGON2_TIME_COST: 2
      ARGON2_PARALLELISM: 1
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
  client:
    image: fayq-ide-modes-client:preview
  nginx:
    image: fayq-platform-nginx:0.8.0-local
    depends_on:
      server: { condition: service_healthy }
      client: { condition: service_started }
  grading:
    image: fayq-ide-modes-controller:test
    environment:
      <<: *env
      GRADING_IMAGE: fayq-assessment-execution:0.9.0
    command: ['node', 'dist/grading-worker.js']
    volumes: ['/var/run/docker.sock:/var/run/docker.sock']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  test:
    image: fayq-ide-modes-controller:test
    environment:
      <<: *env
      PYTHON_TEST_REAL: '1'
    volumes: ['/var/run/docker.sock:/var/run/docker.sock']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  identity-test:
    image: fayq-ide-modes-server:test
    environment:
      <<: *env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
volumes:
  pg-test:
  redis-test:
