services:
  minio:
    image: fayq-materials-minio-fixture:20261004
    environment: { MINIO_ROOT_USER: materials-test, MINIO_ROOT_PASSWORD: synthetic_materials_storage_only }
    volumes: [audit-objects:/data]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:9000/minio/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  audit-objects: {}
