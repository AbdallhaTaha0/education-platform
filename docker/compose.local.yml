# Owner's persistent HTTP preview. Combine with compose.dev.yml.
# External volumes keep existing data through container/image replacement.
services:
  postgres:
    environment:
      # Match the transferred volume's original PGDATA layout. Never infer
      # that an empty alternate directory means the retained database is empty.
      PGDATA: ${LOCAL_PLATFORM_PGDATA_PATH:-/var/lib/postgresql/data/pgdata}
  migrate:
    image: fayq-platform-migrate:0.9.0-m9
  server:
    image: fayq-platform-server:0.9.0-m9
    environment:
      NODE_ENV: development
      SERVICE_VERSION: 0.9.0-m9
      ALLOWED_ORIGINS: http://localhost:8080
      COOKIE_SECURE: 'false'
      OWNER_PREVIEW: '1'
      DRM_BASE_URL: http://host.docker.internal:3000
      DRM_PUBLIC_BASE_URL: http://localhost:3000
      # Keep optional materials storage all-or-none after Docker recreation.
      # The ignored .env supplies the endpoint when its other settings exist.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
    networks: [default, materials]
  client:
    image: fayq-platform-client:0.9.0-m9
  grading:
    build:
      context: ..
      dockerfile: docker/ide/controller.Dockerfile
    image: fayq-assessment-controller:0.9.0
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-education_platform}
      REDIS_URL: redis://redis:6379
      GRADING_IMAGE: fayq-assessment-execution:0.9.0
    # Trusted execution-host controller only. No serving replica or job socket.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
  nginx:
    image: fayq-platform-nginx:0.8.0-local
    ports: !override
      - 127.0.0.1:8080:8080
volumes:
  pgdata:
    name: ${LOCAL_PGDATA_NAME:?configure retained platform database volume}
    external: true
  redisdata:
    name: ${LOCAL_REDISDATA_NAME:?configure retained platform cache volume}
    external: true
networks:
  materials:
    name: fayq-local-materials
    external: true
