services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coordinator
      POSTGRES_PASSWORD: coordinator_synthetic_only_0123456789
      POSTGRES_DB: recovery_recheck
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U coordinator -d recovery_recheck']
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
