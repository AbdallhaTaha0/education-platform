# Platform entry point (Nginx reverse proxy).
#
# Public routes (http://localhost:8080):
#   /        -> frontend shell (client service, SPA fallback)
#   /api/*   -> backend application (server service, /api prefix STRIPPED,
#               so /api/health/live reaches the backend as /health/live)
#
# Internal service names (reachable only inside the Compose network):
#   client:8080 (frontend static), server:3000 (backend API),
#   postgres:5432 (platform PostgreSQL), redis:6379 (platform Redis).
upstream backend {
  server server:3000;
}

upstream frontend {
  server client:8080;
}

server {
  listen 8080;
  server_name _;

  # Harden headers at the edge; backend also sets helmet headers.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /api/ {
    proxy_pass http://backend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }

  # Exact /api without trailing slash -> normalize to backend root path.
  location = /api {
    return 308 /api/;
  }

  # Public signing metadata is intentionally outside /api so standards-based
  # JWT verifiers can use the conventional well-known URL. It contains only
  # public JWK material; the platform server derives it from the private key.
  location = /.well-known/jwks.json {
    proxy_pass http://backend/.well-known/jwks.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }

  location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }
}
