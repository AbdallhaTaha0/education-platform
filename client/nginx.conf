server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback for the foundation shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Never cache the entry document (language shell updates).
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store";
  }
}
