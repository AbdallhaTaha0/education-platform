server {
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml application/xml;
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
  add_header X-Frame-Options DENY always;

  # SPA fallback for the foundation shell.
  location / {
    try_files $uri $uri/ =404;
    error_page 404 /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options DENY always;

  }

  # Never cache the entry document (language shell updates).
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options DENY always;

  }
}
