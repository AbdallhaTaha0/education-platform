<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Product name is a proper noun: the literal string FAYQ, never translated. -->
    <meta name="application-name" content="FAYQ" />
    <meta name="apple-mobile-web-app-title" content="FAYQ" />
    <title>FAYQ — تعلمها. برمجها. حققها.</title>
    <meta
      name="description"
      content="FAYQ — منصة مصرية لتقديم دورات برمجية مسجلة باشتراكات محددة المدة. Learn It. Code It. Get It."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FAYQ" />
    <meta property="og:title" content="FAYQ — تعلمها. برمجها. حققها." />
    <meta
      property="og:description"
      content="FAYQ — منصة مصرية لتقديم دورات برمجية مسجلة باشتراكات محددة المدة. Learn It. Code It. Get It."
    />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FAYQ" />
    <meta
      name="twitter:description"
      content="FAYQ — Learn It. Code It. Get It."
    />
    <!-- Fonts are self-hosted through @fontsource (see src/main.tsx); no
      runtime third-party font fetch, so first paint never waits on it. -->
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the persisted theme before first paint (no flash). Dark is the
      // default. Only the namespaced, non-sensitive theme preference is read;
      // authentication data must never live in browser storage.
      try {
        var stored = window.localStorage.getItem('edu-platform-theme');
        document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
